      <svg width="26" height="26" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><g stroke="#111" stroke-width="2" fill="#111" stroke-linecap="round"><path d="M16 9 L12 3" fill="none"/><path d="M20 9 L24 3" fill="none"/><path d="M15 16 L6 12" fill="none"/><path d="M15 18 L5 19" fill="none"/><path d="M15 20 L7 26" fill="none"/><path d="M21 16 L30 12" fill="none"/><path d="M21 18 L31 19" fill="none"/><path d="M21 20 L29 26" fill="none"/><ellipse cx="18" cy="10" rx="4" ry="3.5" stroke="none"/><ellipse cx="18" cy="17" rx="3.4" ry="3.8" stroke="none"/><ellipse cx="18" cy="26" rx="5.5" ry="7" stroke="none"/></g></svg>
    </div>
  </sc-for>

  <!-- FLASH WARNING -->
  <sc-if value="{{ warnVisible }}" hint-placeholder-val="{{ true }}">
    <div style="{{ warnStyle }}">
      <div style="font-family:'Archivo Black',sans-serif; font-size:clamp(22px,4.4vw,34px); line-height:1.14; letter-spacing:-.5px; color:#fff; max-width:18ch; text-wrap:balance;">GLEICH BLINKT ES</div>
      <p style="margin:0; max-width:36ch; font-size:15px; line-height:1.6; color:#c3bad9; text-wrap:pretty;">Die nächste Seite enthält schnelle Lichtblitze. Wenn du lichtempfindlich bist, schließ bitte kurz die Augen.</p>
      <div style="width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Archivo Black',sans-serif; font-size:30px; color:#00d4aa; background:radial-gradient(circle at 50% 30%,rgba(0,212,170,.18),rgba(0,212,170,.04)); border:1px solid rgba(0,212,170,.45); box-shadow:0 14px 34px -14px rgba(0,212,170,.55), inset 0 1px 0 rgba(255,255,255,.08);">{{ warnCount }}</div>
      <button data-interactive onClick="{{ skipFlash }}" style="display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; min-height:44px; padding:0 20px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.2); color:#cfc8de; font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; letter-spacing:.3px; transition:background .18s ease, border-color .18s ease, color .18s ease;" style-hover="background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.4); color:#fff">Blitze überspringen ›</button>
    </div>
  </sc-if>

  <!-- INTRO SPLASH -->
  <sc-if value="{{ introVisible }}" hint-placeholder-val="{{ true }}">
    <div data-interactive onClick="{{ skipIntro }}" style="{{ introStyle }}">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#fff; animation:introFlicker .1s steps(1) infinite;">
        <img src="bilder/prodigy-ant.png" alt="The Prodigy Ant" style="width:min(58vmin,460px); height:auto; animation:introAntPulse .5s ease-in-out infinite;"/>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot; },
  &quot;soundDefault&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Verhalten&quot; }
}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this._mq = (typeof window !== 'undefined' && window.matchMedia) ? window.matchMedia('(max-width: 700px), (max-aspect-ratio: 1/1)') : null;
    this.state = {
      soundOn: !!(props && props.soundDefault),
      activeZone: null,
      crawlers: [],
      days: null,
      warnVisible: true,
      warnCount: 3,
      introVisible: true,
      introFading: false,
      moonFace: 1,
      taxiOn: false,
      isMobile: this._mq ? this._mq.matches : false,
    };
  }

  startIntroTimers() {
    this._introFade = setTimeout(() => this.setState({ introFading: true }), 2500);
    this._introEnd = setTimeout(() => this.setState({ introVisible: false }), 3000);
  }
  skipFlash = (e) => {
    if (e) e.stopPropagation();
    clearInterval(this._warnTimer);
    this.setState({ warnVisible: false, introVisible: false });
  };
  skipIntro = (e) => {
    if (e) e.stopPropagation();
    clearTimeout(this._introFade); clearTimeout(this._introEnd);
    this.setState({ introFading: true });
    this._introEnd = setTimeout(() => this.setState({ introVisible: false }), 450);
  };

  componentDidMount() {
    const tick = () => {
      const target = new Date('2026-11-24T00:00:00');
      const days = Math.max(0, Math.ceil((target - new Date()) / 86400000));
      this.setState({ days });
    };
    tick();
    this._timer = setInterval(tick, 60000);
    this._warnTimer = setInterval(() => {
      const n = this.state.warnCount - 1;
      if (n <= 0) {
        clearInterval(this._warnTimer);
        this.setState({ warnCount: 0, warnVisible: false });
        this.startIntroTimers();
      } else {
        this.setState({ warnCount: n });
      }
    }, 1000);
    this.scheduleMoon();
    this.scheduleTaxi(true);
    if (this._mq) {
      this._onMq = (e) => this.setState({ isMobile: e.matches });
      if (this._mq.addEventListener) this._mq.addEventListener('change', this._onMq);
      else this._mq.addListener(this._onMq);
    }
  }
  scheduleMoon() {
    const next = () => {
      const toFace2 = this.state.moonFace === 1;
      this.setState({ moonFace: toFace2 ? 2 : 1 });
      this._moonTimer = setTimeout(next, toFace2 ? 1000 : 5000);
    };
    this._moonTimer = setTimeout(next, 5000);
  }
  scheduleTaxi(first) {
    const wait = first ? 6000 + Math.random() * 6000 : 10000 + Math.random() * 25000;
    this._taxiTimer = setTimeout(() => {
      this.setState({ taxiOn: true });
      this._taxiTimer = setTimeout(() => {
        this.setState({ taxiOn: false });
        this.scheduleTaxi(false);
      }, 16200);
    }, wait);
  }
  componentWillUnmount() {
    clearTimeout(this._taxiTimer);
    clearInterval(this._timer); clearInterval(this._warnTimer); clearTimeout(this._moonTimer); clearTimeout(this._introFade); clearTimeout(this._introEnd);
    if (this._mq && this._onMq) {
      if (this._mq.removeEventListener) this._mq.removeEventListener('change', this._onMq);
      else this._mq.removeListener(this._onMq);
    }
    if (this.audio) this.audio.close();
  }

  ensureAudio() {
    if (!this.audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.audio = new AC();
    }
    if (this.audio && this.audio.state === 'suspended') this.audio.resume();
    return this.audio;
  }
  tone({ freqs, type = 'sine', dur = 0.5, gain = 0.08, when = 0 }) {
    const ac = this.audio; if (!ac) return;
    const t0 = ac.currentTime + when;
    freqs.forEach(f => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }
  playBar() { if (!this.state.soundOn) return; this.ensureAudio(); this.tone({ freqs:[261.6,329.6,392.0,493.9], type:'triangle', dur:1.2, gain:0.04 }); }
  playConcert() { if (!this.state.soundOn) return; this.ensureAudio(); this.tone({ freqs:[55,55.4], type:'sine', dur:0.5, gain:0.16 }); this.tone({ freqs:[110,164.8,220], type:'sawtooth', dur:0.4, gain:0.035, when:0.05 }); }

  toggleSound = () => {
    const on = !this.state.soundOn;
    this.setState({ soundOn: on });
    if (on) { this.ensureAudio(); this.tone({ freqs:[660,990], type:'triangle', dur:0.18, gain:0.05 }); }
  };

  enterBar = () => { if (this.state.activeZone !== 'bar') { this.setState({ activeZone:'bar' }); this.playBar(); } };
  leaveBar = () => { if (this.state.activeZone === 'bar') this.setState({ activeZone:null }); };
  clickBar = (e) => { if (e) e.stopPropagation(); if (this.state.activeZone !== 'bar') { this.setState({ activeZone:'bar' }); this.playBar(); } else { this.setState({ activeZone:null }); } };
  enterConcert = () => { if (this.state.activeZone !== 'concert') { this.setState({ activeZone:'concert' }); this.playConcert(); } };
  leaveConcert = () => { if (this.state.activeZone === 'concert') this.setState({ activeZone:null }); };
  clickConcert = (e) => { if (e) e.stopPropagation(); if (this.state.activeZone !== 'concert') { this.setState({ activeZone:'concert' }); this.playConcert(); } else { this.setState({ activeZone:null }); } };

  playBarTap = () => { this.playBar(); };
  playConcertTap = () => { this.playConcert(); };

  onStage = (e) => {
    if (e.target.closest && e.target.closest('a,button,[data-interactive]')) return;
    if (this.state.activeZone) this.setState({ activeZone:null });
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    const dx = (Math.random() - 0.5) * 520;
    const dy = (Math.random() - 0.5) * 520;
    const rot = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    const crawler = { id, x: e.clientX, y: e.clientY, dx, dy, rot };
    this.setState(s => ({ crawlers: [...s.crawlers, crawler] }));
    setTimeout(() => this.setState(s => ({ crawlers: s.crawlers.filter(c => c.id !== id) })), 2300);
  };

  renderVals() {
    const s = this.state;
    return {
      onStage: this.onStage,
      toggleSound: this.toggleSound,
      enterBar: this.enterBar, leaveBar: this.leaveBar, clickBar: this.clickBar,
      enterConcert: this.enterConcert, leaveConcert: this.leaveConcert, clickConcert: this.clickConcert,
      playBarTap: this.playBarTap, playConcertTap: this.playConcertTap,
      days: s.days == null ? '' : String(s.days),
      daysEl: React.createElement('tspan', null, s.days == null ? '' : String(s.days)),
      daysEl2: React.createElement('tspan', null, s.days == null ? '' : String(s.days)),
      isMobile: s.isMobile,
      isDesktop: !s.isMobile,
      soundIcon: s.soundOn ? '🔊' : '🔇',
      crawlers: s.crawlers.map(c => ({
        id: c.id,
        style: { position:'fixed', left:(c.x-13)+'px', top:(c.y-13)+'px', zIndex:5, pointerEvents:'none', '--dx':c.dx+'px', '--dy':c.dy+'px', '--rot':c.rot+'deg', animation:'crawlAway 2.2s ease-in forwards' },
      })),
      warnVisible: s.warnVisible,
      warnCount: s.warnCount,
      skipFlash: this.skipFlash,
      warnStyle: {
        position:'fixed', inset:0, zIndex:60, display:'flex', flexDirection:'column',
        alignItems:'center', justifyContent:'center', gap:'24px', padding:'32px', textAlign:'center',
        background:'radial-gradient(120% 80% at 50% 18%, #2a1a5c 0%, #0d0722 66%)',
        fontFamily:"'Space Grotesk',sans-serif",
      },
      introVisible: s.introVisible && !s.warnVisible,
      taxiOn: s.taxiOn,
      moonFace1: s.moonFace === 1,
      moonFace2: s.moonFace === 2,
      introStyle: {
        position:'fixed', inset:0, zIndex:50, overflow:'hidden', cursor:'pointer',
        animation: s.introFading ? 'introFade .45s ease forwards' : 'none',
      },
      skipIntro: this.skipIntro,
    };
  }
}
</script>
